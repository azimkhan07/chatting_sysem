name: Deploy Staging

# Deploys `main` to the staging environment (docs/11).
# Staging infra does not exist yet — the whole pipeline is gated behind a
# repository variable so CI stays green and this only runs once the server is
# provisioned (Settings → Variables → ENABLE_DEPLOY_STAGING=true).

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Staging deploy (main)
    runs-on: ubuntu-latest
    if: vars.ENABLE_DEPLOY_STAGING == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:staging-${{ github.sha }},ghcr.io/${{ github.repository }}/backend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy backend (migrate → seed → smoke)
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          if [ -z "$STAGING_HOST" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "::warning::STAGING_HOST/SSH_KEY secrets not configured — image pushed, deploy skipped."
            exit 0
          fi
          echo "$STAGING_SSH_KEY" > key.pem && chmod 600 key.pem
          ssh -i key.pem -o StrictHostKeyChecking=no "deploy@$STAGING_HOST" \
            "docker compose -f amtechat/docker/compose.prod.yaml pull backend && \
             docker compose -f amtechat/docker/compose.prod.yaml up -d --force-recreate backend queue scheduler"
          curl -fsS --retry 3 --retry-delay 5 "https://staging.$STAGING_HOST/health" || exit 1

      - name: Post deploy status
        uses: actions/github-script@v7
        with:
          script: |
            const created = "${{ github.event_name }}" === "push"
              && context.payload.head_commit?.message?.trim().length > 0;
            if (!created) return;
            const sha = context.sha.slice(0, 7);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "staging-deploy",
              description: "Deployed to staging",
            });