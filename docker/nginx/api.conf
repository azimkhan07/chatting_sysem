# nginx site config for the amteCHAT API (docs/11).
# Used in the prod-ish overlay (docker/compose.prod.yaml) and expected by
# docker/api/Dockerfile. Only mapped into containers that run php-fpm behind
# nginx — the dev `backend` service uses `php artisan serve`.

server {
    listen 80;
    server_name _;
    root /srv/public;
    index index.php;

    # Laravel-friendly missing-files routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}