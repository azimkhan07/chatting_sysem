# Local dev LiveKit server (docs/11: docker/compose.yaml -> livekit service).
# The browser connects over ws://localhost:7880 for signaling; media flows over
# the UDP range below. Keys must match backend `.env` (LIVEKIT_API_KEY/SECRET)
# so the PHP controller can mint access tokens the server will accept.
port: 7880

logging:
  level: info

keys:
  devkey: devsecret

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100

room:
  empty_timeout: 120